server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: flash-sale-redis
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/flash_sale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:flashsale}
    password: ${DB_PASSWORD:flashsale_dev}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 300ms
      timeout: 300ms
